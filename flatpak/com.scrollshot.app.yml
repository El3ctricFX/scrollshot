app-id: com.scrollshot.app
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: scrollshot

finish-args:
  # Display & Graphics
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Allow saving screenshots to ~/Pictures
  - --filesystem=xdg-pictures
  # Allow swaymsg to communicate with the Sway compositor
  - --filesystem=xdg-run/sway-ipc.*
  # Pass the Sway socket environment variable if it exists
  - --env=SWAYSOCK=$SWAYSOCK

modules:
  # 1. Build the screenshot and input tools
  - name: grim
    buildsystem: meson
    sources:
      - type: git
        url: https://git.sr.ht/~emersion/grim
        tag: v1.4.0

  - name: slurp
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/emersion/slurp
        tag: v1.5.0

  - name: wtype
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/atx/wtype
        tag: v0.4

  # 2. Extract the .deb built by the GitHub Action
  - name: scrollshot
    buildsystem: simple
    build-commands:
      - ar x Scrollshot_0.1.0_amd64.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/scrollshot /app/bin/scrollshot
      - install -Dm644 com.scrollshot.app.desktop /app/share/applications/com.scrollshot.app.desktop
      - install -Dm644 com.scrollshot.app.metainfo.xml /app/share/metainfo/com.scrollshot.app.metainfo.xml
      - install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/com.scrollshot.app.png
    sources:
      - type: file
        path: Scrollshot_0.1.0_amd64.deb
      - type: file
        path: 128x128.png
      - type: file
        path: com.scrollshot.app.desktop
      - type: file
        path: com.scrollshot.app.metainfo.xml